<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Flex JJK</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0b0b1a, #000);
    color: white;
}

/* Título estilo energia amaldiçoada */
h1 {
    text-align: center;
    padding: 20px;
    color: #a855f7;
    text-shadow: 0 0 10px #7c3aed, 0 0 20px #3b82f6;
}

/* Container Flex */
.conteudo {
    display: flex;
    gap: 12px;
    padding: 20px;
    justify-content: space-around;
    flex-wrap: wrap;

    background: linear-gradient(90deg, #0f0f2d, #1a1a40);
    border-top: 2px solid #7c3aed;
    border-bottom: 2px solid #3b82f6;
    box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
}

/* Itens */
.item {
    width: 120px;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: bold;

    background: linear-gradient(145deg, #7c3aed, #3b82f6);
    border-radius: 12px;

    color: white;

    box-shadow:
        0 0 10px #7c3aed,
        0 0 20px #3b82f6;

    transition: 0.3s;
}

/* Efeito hover estilo “energia expandindo” */
.item:hover {
    transform: scale(1.1);
    box-shadow:
        0 0 20px #a855f7,
        0 0 40px #3b82f6;
}
</style>

</head>

<body>

<h1>Flex Box - Jujutsu Style</h1>

<div class="conteudo">
    <div class="item">01</div>
    <div class="item">02</div>
    <div class="item">03</div>
    <div class="item">04</div>
</div>

</body>
</html>
