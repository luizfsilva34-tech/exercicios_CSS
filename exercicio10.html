<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 08 - CSS</title>

    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .borda{
            border-style: solid;
            border-width: 1px;
            border-color: black;
            background-color: rgb(237, 237, 242);
            padding: 10px;
        }

        .borda:hover{
            border-style: solid;
            border-width: 2px;
            border-color: rgb(10, 10, 10);
            background-color: rgb(87, 83, 83);
            padding: 08px;
        }

        .fundo{
            background-image: url(imagem/diana.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-color: aliceblue;
        }

        .cor{
            background-color: grey;
        }
    </style>
</head>
<body>
.top{
    padding: 25px;
    text-align: center right;
    background-color: black;
    height: 20px;
    text-align: center;
}

p{
    text-align: justify;
    padding: 10px;
}
</style>
</head>

<body class="cor">
    <header>
        <div class="top">
            <span class="borda">HOME</span>
            <span class="borda">MENU</span>

        </div>
    </header>
