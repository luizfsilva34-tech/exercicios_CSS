<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loja Esportiva</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Jersey+15&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background: #e9e9e9;
    font-family: "Jersey 15", sans-serif;
}

/* MENU */

.menu{
    width: 100%;
    background: linear-gradient(90deg,#ffee00,#ffd500);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    position: fixed;
    top: 0;
    z-index: 1000;
}

.menu ul{
    list-style: none;
    display: flex;
    padding-left: 20px;
}

.menu ul li{
    position: relative;
}

.menu ul li a{
    display: block;
    padding: 18px 30px;
    color: black;
    text-decoration: none;
    font-size: 24px;
    transition: 0.3s;
}

.menu ul li a:hover{
    background: yellowgreen;
    color: white;
}

/* SUBMENU */

.menu ul ul{
    display: none;
    position: absolute;
    top: 60px;
    left: 0;
    background: #ffe600;
    min-width: 220px;
    flex-direction: column;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
}

.menu ul li:hover > ul{
    display: flex;
}

.menu ul ul li a{
    padding: 15px;
}

/* BANNER */

.banner{
    height: 100vh;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1517466787929-bc90951d0974?q=80&w=1600&auto=format&fit=crop');
    
    background-size: cover;
    background-position: center;

    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.banner-content h1{
    font-size: 90px;
    margin-bottom: 20px;
    text-shadow: 4px 4px 10px rgba(0,0,0,0.5);
}

.banner-content p{
    font-size: 30px;
    margin-bottom: 30px;
}

.banner-content button{
    padding: 15px 40px;
    border: none;
    background: yellow;
    font-family: "Jersey 15", sans-serif;
    font-size: 25px;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.3s;
}

.banner-content button:hover{
    background: yellowgreen;
    color: white;
    transform: scale(1.05);
}

/* PRODUTOS */

.produtos{
    padding: 80px 50px;
}

.titulo{
    text-align: center;
    font-size: 60px;
    margin-bottom: 50px;
}

.cards{
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.card{
    width: 300px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-10px);
}

.card img{
    width: 100%;
    height: 300px;
    object-fit: cover;
}

.card h2{
    padding: 15px;
    font-size: 35px;
}

.card p{
    padding: 0 15px 20px;
    font-size: 22px;
}

.card button{
    margin: 0 15px 20px;
    padding: 10px 20px;
    border: none;
    background: yellowgreen;
    color: white;
    font-family: "Jersey 15", sans-serif;
    font-size: 22px;
    border-radius: 10px;
    cursor: pointer;
}

/* RESPONSIVO */

@media(max-width:800px){

    .banner-content h1{
        font-size: 60px;
    }

    .banner-content p{
        font-size: 22px;
    }

    .menu ul{
        flex-direction: column;
    }

}

</style>
</head>

<body>

<!-- MENU -->

<nav class="menu">

    <ul>

        <li>
            <a href="#">CAMISAS</a>

            <ul>
                <li><a href="#">FUTEBOL</a></li>
                <li><a href="#">BASQUETE</a></li>
                <li><a href="#">VOLEI</a></li>
            </ul>

        </li>

        <li><a href="#">CAMISETAS</a></li>
        <li><a href="#">SAPATOS</a></li>
        <li><a href="#">CALÇAS</a></li>

    </ul>

</nav>

<!-- BANNER -->

<section class="banner">

    <div class="banner-content">

        <h1>SPORT STYLE</h1>

        <p>As melhores roupas esportivas do momento</p>

        <button>COMPRAR AGORA</button>

    </div>

</section>

<!-- PRODUTOS -->

<section class="produtos">

    <h1 class="titulo">PRODUTOS EM DESTAQUE</h1>

    <div class="cards">

        <div class="card">

            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=1200&auto=format&fit=crop">

            <h2>CAMISA</h2>

            <p>Modelo esportivo premium.</p>

            <button>VER MAIS</button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop">

            <h2>TÊNIS</h2>

            <p>Conforto e desempenho.</p>

            <button>VER MAIS</button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1506629905607-d405b7a6eae9?q=80&w=1200&auto=format&fit=crop">

            <h2>CALÇAS</h2>

            <p>Estilo moderno e esportivo.</p>

            <button>VER MAIS</button>

        </div>

    </div>

</section>

</body>
</html>
