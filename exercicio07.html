<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Site Exemplo</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Topo */
    header {
        background: black;
        color: #7CFC00;
        padding: 10px;
        display: flex;
        align-items: center;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
    }

    /* Barra de busca */
    .search-bar {
        background: #001f7f;
        padding: 5px;
    }

    .search-bar input {
        padding: 5px;
    }

    /* Layout principal */
    .container {
        display: flex;
    }

    /* Menu lateral */
    nav {
        background: #a52a2a;
        width: 200px;
        padding: 10px;
        color: white;
    }

    nav ul {
        list-style: none;
        padding: 0;
    }

    nav li {
        margin: 10px 0;
    }

    /* Conteúdo */
    main {
        flex: 1;
        padding: 10px;
        background: #eee;
    }

    .highlight {
        background: #00cfff;
        color: black;
        padding: 2px;
    }

    .pink {
        color: hotpink;
    }
</style>

</head>
<body>

<header>
    <h1>🐻 logo ipsum</h1>
</header>

<div class="search-bar">
    <input type="text" placeholder="Pesquisar">
</div>

<div class="container">
    <nav>
        <ul>
            <li>Foto</li>
            <li>Vídeo</li>
            <li>Músicas</li>
        </ul>
    </nav>

    <main>
        <p>
            <span class="highlight">
                Lorem ipsum dolor sit amet consectetur adipisicing
            </span>
            <span class="pink">
                tenetur reiciendis distinctio debitis!
            </span>
        </p>
    </main>
</div>

</body>
</html>
